<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <filter id="p" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="2" seed="7" result="trowel"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.32" numOctaves="2" seed="3" result="grain"/>
    <feComposite in="trowel" in2="grain" operator="arithmetic" k1="0" k2="0.45" k3="0.55" k4="0" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="1.3" diffuseConstant="1" lighting-color="#ffffff" result="lit">
      <feDistantLight azimuth="180" elevation="38"/>
    </feDiffuseLighting>
    <feComponentTransfer in="lit" result="lift">
      <feFuncR type="linear" slope="0.5" intercept="0.62"/>
      <feFuncG type="linear" slope="0.5" intercept="0.61"/>
      <feFuncB type="linear" slope="0.5" intercept="0.59"/>
    </feComponentTransfer>
    <feFlood flood-color="#eeeae5" result="tint"/>
    <feBlend in="lift" in2="tint" mode="multiply"/>
  </filter>
  <rect width="1200" height="750" filter="url(#p)"/>
</svg>
