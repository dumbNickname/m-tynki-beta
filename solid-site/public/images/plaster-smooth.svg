<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <filter id="p" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.006" numOctaves="2" seed="7" result="trowel"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="1" seed="11" result="grain"/>
    <feComposite in="trowel" in2="grain" operator="arithmetic" k1="0" k2="0.94" k3="0.06" k4="0" result="height"/>
    <feDiffuseLighting in="height" surfaceScale="5" diffuseConstant="1" lighting-color="#ffffff" result="lit">
      <feDistantLight azimuth="180" elevation="28"/>
    </feDiffuseLighting>
    <feComponentTransfer in="lit" result="lift">
      <feFuncR type="linear" slope="0.62" intercept="0.55"/>
      <feFuncG type="linear" slope="0.62" intercept="0.54"/>
      <feFuncB type="linear" slope="0.62" intercept="0.52"/>
    </feComponentTransfer>
    <feFlood flood-color="#f3f0ec" result="tint"/>
    <feBlend in="lift" in2="tint" mode="multiply"/>
  </filter>
  <rect width="1200" height="750" filter="url(#p)"/>
</svg>
